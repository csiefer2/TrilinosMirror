on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  copy-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the target repository
        uses: actions/checkout@v4
        with:
          repository: csiefer2/TrilinosMirror
          # Use your PAT here instead of GITHUB_TOKEN
          token: ${{ secrets.MIRROR_PAT }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git remote add upstream https://github.com/trilinos/Trilinos.git
          git fetch upstream develop

      - name: Update Develop from trilinos/Trilinos
        run: |
          # Ensure your mirror's develop is up to date to avoid workflow drift
          git checkout --track origin/develop
          git merge upstream/develop
          git push origin develop

      - name: Get PRs authored by specific users
        id: get_prs
        env:
          GH_TOKEN: ${{ secrets.MIRROR_PAT }} # Use PAT for CLI calls too
        run: |
          PRS=$(gh pr list --repo trilinos/Trilinos --state open --json number,author --jq '.[] | select(.author.login == "csiefer2" or .author.login == "cgcgcg" or .author.login == "MalachiTimothyPhillips" or .author.login == "rwpawlo") | .number')
          echo "prs=$(echo $PRS | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Mirror PRs
        if: steps.get_prs.outputs.prs != ''
        env:
          GH_TOKEN: ${{ secrets.MIRROR_PAT }}
        run: |
          IFS=' ' read -r -a pr_array <<< "${{ steps.get_prs.outputs.prs }}"
          for pr in "${pr_array[@]}"; do
            [[ -z "$pr" ]] && continue

            echo "Analyzing PR #$pr..."

            # 1. Strict check: Does this PR touch .github/ at all?
            # We check the diff between the PR head and the upstream develop
            TOUCHES_CONFIG=$(gh pr view $pr --repo trilinos/Trilinos --json files --jq '.files[].path' | grep "^\.github/") || true
            echo "TOUCHES_CONFIG = $TOUCHES_CONFIG"

            if [ -not -z "$TOUCHES_CONFIG" ]; then
              echo "Skipping PR #$pr: contains changes to .github directory."
              continue
            fi

            MIRROR_BRANCH="pr-mirror-$pr"

            # 2. Fetch and Push
            # Using the PAT (set in the checkout step) allows this push to succeed
            # even if the branch contains workflow files.
            echo "Working on $MIRROR_BRANCH"
            git fetch upstream pull/$pr/head:$MIRROR_BRANCH -f
            git checkout $MIRROR_BRANCH
            git push origin $MIRROR_BRANCH:$MIRROR_BRANCH -f

            # 3. Create Mirror PR if it doesn't exist
            echo "Preparing to create PR on the Mirror: $MIRROR_BRANCH"
            PR_EXISTS=$(gh pr list --repo csiefer2/TrilinosMirror --head "$MIRROR_BRANCH" --base develop --json number --jq '.[0].number')
            if [ -z "$PR_EXISTS" ]; then
              PR_TITLE=$(gh pr view $pr --repo trilinos/Trilinos --json title --jq '.title')
              PR_BODY=$(gh pr view $pr --repo trilinos/Trilinos --json body --jq '.body')
              echo "PR_TITLE name is: $PR_TITLE"
              echo "$PR_BODY"
              gh pr create \
                --repo csiefer2/TrilinosMirror \
                --title "[Mirror] $PR_TITLE" \
                --body "Automated mirror of upstream PR trilinos/Trilinos#$pr $PR_BODY" \
                --head "$MIRROR_BRANCH" \
                --base "develop"
            else
              echo "Mirror PR #$PR_EXISTS already exists. Doing nothing."
            fi
          done
