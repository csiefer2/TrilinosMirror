on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write # Changed to write to allow PR creation

jobs:
  copy-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the target repository
        uses: actions/checkout@v4
        with:
          repository: csiefer2/TrilinosMirror
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git remote add upstream https://github.com/trilinos/Trilinos.git

      - name: Get PRs authored by specific users
        id: get_prs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRS=$(gh pr list --repo trilinos/Trilinos --state open --json number,author --jq '.[] | select(.author.login == "csiefer2" or .author.login == "cgcgcg") | .number')          
          echo "prs=$(echo $PRS | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Mirror PRs to target repository
        if: steps.get_prs.outputs.prs != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IFS=' ' read -r -a pr_array <<< "${{ steps.get_prs.outputs.prs }}"          
          for pr in "${pr_array[@]}"; do
            [[ -z "$pr" ]] && continue
            
            echo "Checking PR #$pr for .github changes..."
            
            # 1. Ignore PRs that touch .github
            FILES=$(gh pr view $pr --repo trilinos/Trilinos --json files --jq '.files[].path')
            if echo "$FILES" | grep -q "^\.github/"; then
              echo "Skipping PR #$pr: it modifies the .github directory."
              continue
            fi

            MIRROR_BRANCH="pr-mirror-$pr"

            # 2. Mirror the branch
            git fetch upstream pull/$pr/head:$MIRROR_BRANCH -f
            git push origin $MIRROR_BRANCH -f
            
            # 3. Mirror the actual Pull Request
            # Check if PR already exists in the mirror repo for this branch
            PR_EXISTS=$(gh pr list --head "$MIRROR_BRANCH" --json number --jq '.[0].number')

            if [ -z "$PR_EXISTS" ]; then
              echo "Creating mirror PR for #$pr..."
              # Fetch original title to make the mirror PR look correct
              PR_TITLE=$(gh pr view $pr --repo trilinos/Trilinos --json title --jq '.title')
              
              gh pr create \
                --title "[Mirror] $PR_TITLE" \
                --body "Automated mirror of upstream PR trilinos/Trilinos#$pr" \
                --head "$MIRROR_BRANCH" \
                --base "master" # Ensure this matches your mirror's default branch
            else
              echo "Mirror PR already exists as #$PR_EXISTS. Branch updated."
            fi
          done
